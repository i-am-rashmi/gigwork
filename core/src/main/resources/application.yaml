spring:
  application:
    name: gigwork-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gigwork_core}
    username: ${DB_USER:core_app}
    password: ${DB_PASSWORD:core_app}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true   # Java 21 virtual threads for request handling

gigwork:
  identity:
    # Secrets have no value here on purpose (NFR-45). Outside the local and test profiles set, from the
    # environment: GIGWORK_IDENTITY_MOBILE_HASH_KEY, GIGWORK_IDENTITY_OTP_HASH_KEY (each at least 32 characters)
    # and the JWT key pair GIGWORK_IDENTITY_JWT_PRIVATE_KEY / GIGWORK_IDENTITY_JWT_PUBLIC_KEY (PEM).
    otp:
      sender: none   # none | dev. 'dev' logs codes and is refused outside the local and test profiles
      send-timeout: 5s   # after this the delivery counts as failed (503)
    jwt:
      issuer: gigwork-core
      access-token-ttl: 15m
    session:
      idle-timeout: 7d
      absolute-timeout: 30d

  jobs:
    enabled: true   # ADR-0010: false turns every scheduled job off (tests call the job methods directly)

  reference:
    location:
      max-distance-from-zone-km: 50   # a gig's map point farther than this from the nearest live zone is rejected
      label-radius-meters: 2000       # a map point is labelled with the nearest locality within this distance

  profile:
    # Talent profile limits (FR-4 to FR-6); these are also the defaults
    max-categories: 5
    max-specialisations: 10
    max-links: 10
    location:
      max-distance-from-zone-km: 50   # a map point farther than this from the nearest live zone is rejected (FR-5)
      label-radius-meters: 2000       # a map point is labelled with the nearest locality within this distance
    portfolio:
      blocked-hosts: [bit.ly, tinyurl.com, t.co, goo.gl, rb.gy, cutt.ly, is.gd]   # URL shorteners (FR-6)

  availability:
    default-time-zone: Asia/Kolkata   # all-day blocks and the calendar of a Talent with no saved location
    max-upcoming-blocks: 200          # FR-7: busy blocks that have not ended yet, per Talent
    max-block-days: 90                # FR-7: longest busy block
    max-calendar-days: 92             # longest range of one calendar request

springdoc:
  # API docs and Swagger UI are off by default; the local profile switches them on
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for the router and rolling deploys
